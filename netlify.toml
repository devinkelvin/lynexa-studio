# Lynexa — Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Fingerprinted CSS/JS, fonts and images never change at the same URL
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects and the Content-Security-Policy live in dist/_redirects and dist/_headers,
# generated by build.mjs. The CSP is applied to production only, so Netlify's
# deploy-preview toolbar (the Netlify Drawer) can load on previews.
